name: Build unsigned beta packages
on:
  workflow_dispatch:
  push:
    branches: ['release/docaville-1.1.0-preparation']
    paths-ignore: ['docs/**', 'licenses/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: beta-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            args: --mac dmg zip --arm64 --x64
          - os: windows-latest
            target: windows
            args: --win nsis --x64
          - os: ubuntu-latest
            target: linux
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run notices
      - run: npx electron-builder ${{ matrix.args }}
      - run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Docaville-beta-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
